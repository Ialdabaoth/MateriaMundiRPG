<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Module viewer. Layout: map stage fills the left, gazetteer rail on the right (stacks under the map on phones).
   The maps are the same SVGs the print pages are drawn from. Print page numbers and PDF links are hidden until the print
   process is settled (Heph 2026-11-07); Marches are named by their id. */
:root {
  --bg: #e9ecdf; --panel: #f7f8f1; --ink: #1f2a1d; --muted: #5b6855; --accent: #7a2e2e; --line: #cdd4c1; --hi: #f2d66b; --paper: #f4efe1;
  --display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121812; --panel: #1a221a; --ink: #e4e9dc; --muted: #9aa893; --accent: #e09a88; --line: #2e3a2d; --hi: #f2d66b; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #121812; --panel: #1a221a; --ink: #e4e9dc; --muted: #9aa893; --accent: #e09a88; --line: #2e3a2d; --hi: #f2d66b; color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.crumb { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px }
h1 { font: 24px/1.2 var(--display); margin: 0; text-wrap: balance } h1 small { font: 15px var(--body); color: var(--muted) }
h1 small a { color: var(--accent); text-decoration: none; white-space: nowrap } h1 small a:hover { text-decoration: underline } h1 .sep { margin: 0 6px; color: var(--muted) }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
button, .btn { font: 500 14px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; text-decoration: none }
button:hover, .btn:hover { border-color: var(--accent) } button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.ver { font-size: 12px; color: var(--muted); margin: 10px 0 0; font-variant-numeric: tabular-nums }
.chk { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: var(--ink); cursor: pointer; margin-right: 4px } .chk input { accent-color: var(--accent); margin: 0 }
#stage svg.noedges .hx, #stage svg.noedges .pagehex:not(.on) polygon, #stage svg.noedges .league-edge polygon { stroke: none }
select { font: 500 14px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; cursor: pointer }
.zoom { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 3.5em; text-align: center }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 310px }
#stage { overflow: auto; position: relative; background: var(--paper); min-height: 0 }
#stage svg { display: block } #stage svg a { cursor: pointer } #stage svg a:hover text { fill: #7a2e2e }
#stage .pagehex polygon { fill: #7a2e2e; fill-opacity: 0; stroke: #7a2e2e; stroke-width: 3; stroke-dasharray: 12 6 }
#stage .pagehex:hover polygon { fill-opacity: .08 } #stage .pagehex.on polygon { stroke-width: 6; stroke-dasharray: none }
#stage .pagehex text { font: bold 22px Georgia, serif; fill: #7a2e2e; stroke: #f4efe1; stroke-width: 4; paint-order: stroke }
.msg { padding: 24px; color: #5b5040; font-style: italic }
#stage .sel { fill: #f2d66b; fill-opacity: .35; stroke: #7a2e2e; stroke-width: 5; pointer-events: none }
#stage .mark circle { fill: #7a2e2e; stroke: #f4efe1; stroke-width: 4 } #stage .mark { pointer-events: none }
#stage .mark text { font: bold 20px Georgia, serif; fill: #f4efe1; text-anchor: middle; dominant-baseline: central }
#hexinfo { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px }
#hexinfo h2 { margin: 0 } #hexinfo p { margin: 0; font-size: 14px } #hexinfo a { color: var(--accent) }
.ring { fill: none; stroke: #c0392b; stroke-width: 4; animation: pulse 1.6s ease-in-out infinite }
@keyframes pulse { 50% { stroke-opacity: .25; stroke-width: 9 } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none } }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; min-height: 0;
  padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px }
aside input { width: 100%; box-sizing: border-box; font: 15px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px }
aside h2 { font: 17px var(--display); margin: 0 0 4px; color: var(--accent); letter-spacing: .02em }
aside ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px }
aside li a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink); padding: 3px 6px; border-radius: 4px }
aside li a:hover { background: var(--bg) } aside li a.on { background: var(--hi); color: #1f2a1d }
aside li a span:last-child { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums }
aside li a.on span:last-child { color: #3d4a37 }
#lists { display: grid; gap: 14px }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin: 0 }
.note code { font-size: 12.5px; background: var(--bg); padding: 1px 4px; border-radius: 3px; word-break: break-all }
/* ?mode=map shows only the map (with zoom buttons); ?mode=atlas only the page list. An app can show each in its own frame. */
html[data-mode="map"] body::before, [data-mode="map"] .crumb, [data-mode="map"] #prev, [data-mode="map"] #next, [data-mode="map"] aside { display: none }
[data-mode="map"] header { position: fixed; top: 8px; right: 8px; padding: 0; border: 0; background: transparent }
[data-mode="map"] .tools { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 2px 8px rgb(0 0 0 / .15) }
html[data-mode="map"] body { height: 100% }
html[data-mode="map"] main { flex: 1; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) }
[data-tools="host"][data-mode="map"] header { display: none }
/* ?mode=key: the map key for an app that shows the map in another frame (it relays the map frame's "key" message here).
   Drawn as the E9 Atlas app's side panel draws its key: terrain in view, places in view, creatures here. */
#key { display: none }
[data-mode="key"] header, [data-mode="key"] #stage, [data-mode="key"] #hexinfo, [data-mode="key"] #q, [data-mode="key"] #lists, [data-mode="key"] #foot { display: none !important }
html[data-mode="key"] main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto }
[data-mode="key"] aside { border: 0 } [data-mode="key"] #key { display: block; font-size: 13px }
#key h2 { font: 13px var(--body); margin: 10px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
#key h2:first-child { margin-top: 0 }
#key .row { display: flex; align-items: center; gap: 8px; padding: 2px 0 } #key .pl { cursor: pointer; border-radius: 4px } #key .pl:hover { background: var(--bg) }
#key .sw { width: 30px; height: 26px; flex: none } #key small { color: var(--muted) } #key .none { color: var(--muted) }
[data-mode="atlas"] header, [data-mode="atlas"] #stage, [data-mode="atlas"] #hexinfo { display: none !important }
html[data-mode="atlas"] main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto }
[data-mode="atlas"] aside { border: 0 }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 68vh auto; flex: none } body { height: auto }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)) } }
</style>
<script>document.documentElement.dataset.mode = { map: 'map', atlas: 'atlas', key: 'key' }[new URLSearchParams(location.search).get('mode')] || 'full';
// ?tools=host: the app around the frame draws the language, hex-edge and zoom controls itself (see "tools" messages below).
if (new URLSearchParams(location.search).get('tools') === 'host') document.documentElement.dataset.tools = 'host';</script>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><!--SYMBOLS--></defs></svg>
<header>
  <div class="crumb"><h1 id="title">Loading</h1></div>
  <div class="tools">
    <select id="lang" aria-label="Language"><option value="ga">Gaeilge</option><option value="en">English</option></select>
    <label class="chk"><input type="checkbox" id="edges" checked> Hex Edges</label>
    <a class="btn" id="prev" hidden>‹ Prev</a><a class="btn" id="next" hidden>Next ›</a>
    <button id="zo" aria-label="Zoom out">−</button><span class="zoom" id="zl">100%</span><button id="zi" aria-label="Zoom in">+</button><button id="zf">Fit</button>
  </div>
</header>
<main>
  <div id="stage"><p class="msg">Loading the map…</p></div>
  <aside>
    <section id="hexinfo" hidden aria-live="polite"></section>
    <div id="key"><p class="none">Loading the key…</p></div>
    <input id="q" type="search" placeholder="Find a site or page" aria-label="Find a site or page">
    <div id="lists"></div>
    <p class="note" id="foot"></p>
    <p class="ver" id="ver"></p>
  </aside>
</main>
<!--CARD-->

<script>

  places: D.sites.filter(s => s.encounter && s.league).map(s => ({ get name() { return L(s.name); }, pointers: s.encounter, go: () => { location.hash = '#' + s.league + '--' + s.slug; } })) });
const stage = document.getElementById('stage'), lists = document.getElementById('lists'), NS = 'http://www.w3.org/2000/svg';
const EX = Object.fromEntries(D.leagues.map(p => [p.key, p])), AL = D.aliases || {};

  if (site && !(EX[k] && EX[k].sites.some(s => s.slug === f))) k = site.league;   // an old link whose site now has its own League

  z = Math.max(fit() * .5, Math.min(3, nz));

}
// "Hex edges" box: off hides the hex outlines and swaps each background tile for its "-x" twin without the painted rim (hexmap.py icon_defs)
try { $('edges').checked = localStorage.getItem('mm-hex-edges') !== 'off'; } catch (e) {}
function edges() {
  if (!svg) return; const on = $('edges').checked; svg.classList.toggle('noedges', !on);
  const twins = new Set([...document.querySelectorAll('symbol[id$="-x"]')].map(e => '#' + e.id));
  svg.querySelectorAll('use').forEach(u => {
    const h = u.getAttribute('href'); if (!h || !/^#i-(bg|bleed)-/.test(h) || u.closest('symbol')) return;
    const base = h.replace(/-x$/, ''); if (twins.has(base + '-x')) u.setAttribute('href', on ? base : base + '-x');
  });
}
$('edges').addEventListener('change', () => { try { localStorage.setItem('mm-hex-edges', $('edges').checked ? 'on' : 'off'); } catch (e) {} edges(); tellTools(); });
const SC_LEAGUE = '1 hex = 1 league (' + D.scales.march_hex_mi + ' miles)', SC_FIELD = '1 hex = 1 field (' + D.scales.league_hex_mi + ' miles)';
// Language box: map labels, page titles and lists in Irish (the names as drawn) or English, from module.json "names"
let LANG = 'ga'; try { LANG = localStorage.getItem('mm-lang') || 'ga'; } catch (e) {}
$('lang').value = LANG;
function L(s) { const n = D.names && D.names[s]; return (n && n[LANG]) || s; }
function relabel() { if (svg) svg.querySelectorAll('text').forEach(t => { if (t.dataset.o === undefined) t.dataset.o = t.textContent; t.textContent = L(t.dataset.o); }); }
$('lang').addEventListener('change', () => { LANG = $('lang').value; try { localStorage.setItem('mm-lang', LANG); } catch (e) {} lists.replaceChildren(); build(); route(); relabel(); tellTools(); });
function marchOf(hex) { const [x, y] = hexCenter(hex); let best = null, bd = Infinity; for (const a of D.marches) { const d = (a.center_px[0] - x) ** 2 + (a.center_px[1] - y) ** 2; if (d < bd) { bd = d; best = a; } } return best; }
function hexPts(cx, cy, r) { return [0, 60, 120, 180, 240, 300].map(a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)].map(v => v.toFixed(1)).join(',')).join(' '); }
function pageHexes() {
  const g = document.createElementNS(NS, 'g');
  for (const a of D.marches) {
    const l = document.createElementNS(NS, 'a'); l.setAttribute('href', '#march-' + a.page); l.setAttribute('class', 'pagehex'); l.dataset.page = a.page;
    const p = document.createElementNS(NS, 'polygon'); p.setAttribute('points', hexPts(a.center_px[0], a.center_px[1], a.radius_px));
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', a.center_px[0]); t.setAttribute('y', a.center_px[1] - a.radius_px * .78); t.setAttribute('text-anchor', 'middle');

// Every map shares the world map's hex geometry: flat-top, odd columns shifted down, ids CCRR from 0101.
const G = D.world, R = G.col_px / 1.5;
function hexCenter(id) { const c = +id.slice(0, 2) - 1, r = +id.slice(2) - 1; return [G.origin_px[0] + c * G.col_px, G.origin_px[1] + r * G.hex_px + (c & 1 ? G.hex_px / 2 : 0)]; }

    const r0 = Math.round((y - G.origin_px[1] - (c & 1 ? G.hex_px / 2 : 0)) / G.hex_px);

let hexIds = new Set(), marks = [], terrain = null;
const TERRAIN = { grass: 'open grassland', forest: 'forest (double travel time)', woods: 'light woods (double travel time)', hills: 'hills', mount: 'mountains', sea: 'sea', bog: 'bog' };
async function loadTerrain() {
  if (!terrain) terrain = fetch('module.json').then(r => r.json()).then(m => Object.fromEntries(m.world.hexes.map(h => [h.id, h.t]))).catch(() => ({}));

}
function poly(cls, id) { const p = document.createElementNS(NS, 'polygon'); const [x, y] = hexCenter(id); p.setAttribute('points', hexPts(x, y, R)); p.setAttribute('class', cls); svg.append(p); }
function mapOf(r) { return r.view === 'expl' ? r.key : 'world'; }

    g.setAttribute('class', 'mark'); c.setAttribute('cx', x); c.setAttribute('cy', y - R * .35); c.setAttribute('r', 22);
    t.setAttribute('x', x); t.setAttribute('y', y - R * .35); t.textContent = (m.label || '•').slice(0, 2);

// What's in view, for an app that shows the key in another frame (?mode=key): terrain, places, creatures here.
// Terrain tiles as hexmap.py draws them (T_BG / T_ICON there).
const T_BG = { grass: 'bg-green', forest: 'bg-green', woods: 'bg-green', hills: 'bg-green', mount: 'bg-brown', bog: 'bg-grey', sea: 'bg-blue' };

let keyTimer = 0;
function tellKey() {

      return { slug: s.slug, name: L(s.name), kind: full.kind || '', book: full.book || '', hash: '#' + (full.league || r.key) + '--' + s.slug, icon: u ? u.getAttribute('href').slice(3) : null };
    });

stage.addEventListener('scroll', tellKey, { passive: true });
// The key frame (?mode=key) draws what the map frame told it, as the Atlas app's side panel does.
const escK = v => String(v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function drawKey(k) {
