<meta charset="utf-8">
<title>{{TITLE}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Module viewer. Layout: map stage fills the left, gazetteer rail on the right (stacks under the map on phones).
   The maps are the same SVGs the print PDFs are made from; page numbers match the books. */
:root {
  --bg: #e9ecdf; --panel: #f7f8f1; --ink: #1f2a1d; --muted: #5b6855; --accent: #7a2e2e; --line: #cdd4c1; --hi: #f2d66b; --paper: #f4efe1;
  --display: "IM Fell English SC", "Palatino Linotype", Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121812; --panel: #1a221a; --ink: #e4e9dc; --muted: #9aa893; --accent: #e09a88; --line: #2e3a2d; --hi: #f2d66b; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #121812; --panel: #1a221a; --ink: #e4e9dc; --muted: #9aa893; --accent: #e09a88; --line: #2e3a2d; --hi: #f2d66b; color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); display: flex; flex-direction: column; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.crumb { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px }
.crumb .up { font-size: 13px; color: var(--muted); text-decoration: none } .crumb .up:hover { color: var(--accent) }
h1 { font: 26px/1.1 var(--display); margin: 0; text-wrap: balance } h1 small { font: 14px var(--body); color: var(--muted); margin-left: 8px }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
button, .btn { font: 500 14px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; text-decoration: none }
button:hover, .btn:hover { border-color: var(--accent) } button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.zoom { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 3.5em; text-align: center }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 310px }
#stage { overflow: auto; position: relative; background: var(--paper); min-height: 0 }
#stage svg { display: block } #stage svg a { cursor: pointer } #stage svg a:hover text { fill: #7a2e2e }
#stage .pagehex polygon { fill: #7a2e2e; fill-opacity: 0; stroke: #7a2e2e; stroke-width: 3; stroke-dasharray: 12 6 }
#stage .pagehex:hover polygon { fill-opacity: .08 } #stage .pagehex.on polygon { stroke-width: 6; stroke-dasharray: none }
#stage .pagehex text { font: bold 22px Georgia, serif; fill: #7a2e2e; stroke: #f4efe1; stroke-width: 4; paint-order: stroke }
.msg { padding: 24px; color: #5b5040; font-style: italic }
.ring { fill: none; stroke: #c0392b; stroke-width: 4; animation: pulse 1.6s ease-in-out infinite }
@keyframes pulse { 50% { stroke-opacity: .25; stroke-width: 9 } }
@media (prefers-reduced-motion: reduce) { .ring { animation: none } }
aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; min-height: 0;
  padding-block: 14px 24px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px }
aside input { width: 100%; box-sizing: border-box; font: 15px var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px }
aside h2 { font: 17px var(--display); margin: 0 0 4px; color: var(--accent); letter-spacing: .02em }
aside ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px }
aside li a { display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink); padding: 3px 6px; border-radius: 4px }
aside li a:hover { background: var(--bg) } aside li a.on { background: var(--hi); color: #1f2a1d }
aside li a span:last-child { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums }
aside li a.on span:last-child { color: #3d4a37 }
#lists { display: grid; gap: 14px }
.note { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin: 0 }
.note code { font-size: 12.5px; background: var(--bg); padding: 1px 4px; border-radius: 3px; word-break: break-all }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: 68vh auto; flex: none } body { height: auto }
  aside { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)) } }
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><!--SYMBOLS--></defs></svg>
<header>
  <div class="crumb"><a class="up" id="up" href="#world" hidden></a><h1 id="title">Loading</h1></div>
  <div class="tools">
    <a class="btn" id="prev" hidden>‹ Prev</a><a class="btn" id="next" hidden>Next ›</a>
    <button id="zo" aria-label="Zoom out">−</button><span class="zoom" id="zl">100%</span><button id="zi" aria-label="Zoom in">+</button><button id="zf">Fit</button>
  </div>
</header>
<main>
  <div id="stage"><p class="msg">Loading the map…</p></div>
  <aside>
    <input id="q" type="search" placeholder="Find a site or page" aria-label="Find a site or page">
    <div id="lists"></div>
    <p class="note" id="foot"></p>
  </aside>
</main>
<script type="application/json" id="module-data">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById('module-data').textContent);
const stage = document.getElementById('stage'), lists = document.getElementById('lists'), NS = 'http://www.w3.org/2000/svg';
const EX = Object.fromEntries(D.exploration.map(p => [p.key, p]));
const cache = {}; let cur = null, natW = 1, natH = 1, z = 1, svg = null;
const $ = id => document.getElementById(id);
function load(path) { return cache[path] ||= fetch(path).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }); }
function parse() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ''));
  const m = raw.match(/^atlas-(\d+)$/);
  if (m && D.atlas[+m[1] - 1]) return { view: 'atlas', page: +m[1] };
  const [k, f] = raw.split('--');
  if (EX[k]) return { view: 'expl', key: k, focus: f };
  return { view: 'world' };
}
function fit() { return Math.min(1, stage.clientWidth / natW); }
function setZoom(nz, fx, fy) {
  if (!svg) return;
  const cx = fx ?? (stage.scrollLeft + stage.clientWidth / 2) / (natW * z), cy = fy ?? (stage.scrollTop + stage.clientHeight / 2) / (natH * z);
  z = Math.max(fit() * .5, Math.min(3, nz));
  svg.style.width = natW * z + 'px'; svg.style.height = natH * z + 'px';
  stage.scrollLeft = cx * natW * z - stage.clientWidth / 2; stage.scrollTop = cy * natH * z - stage.clientHeight / 2;
  $('zl').textContent = Math.round(z * 100) + '%';
}
function hexPts(cx, cy, r) { return [0, 60, 120, 180, 240, 300].map(a => [cx + r * Math.cos(a * Math.PI / 180), cy + r * Math.sin(a * Math.PI / 180)].map(v => v.toFixed(1)).join(',')).join(' '); }
function pageHexes() {
  const g = document.createElementNS(NS, 'g');
  for (const a of D.atlas) {
    const l = document.createElementNS(NS, 'a'); l.setAttribute('href', '#atlas-' + a.page); l.setAttribute('class', 'pagehex'); l.dataset.page = a.page;
    const p = document.createElementNS(NS, 'polygon'); p.setAttribute('points', hexPts(a.center_px[0], a.center_px[1], a.radius_px));
    const t = document.createElementNS(NS, 'text'); t.setAttribute('x', a.center_px[0]); t.setAttribute('y', a.center_px[1] - a.radius_px * .78); t.setAttribute('text-anchor', 'middle');
    t.textContent = 'p. ' + a.page; l.append(p, t); g.append(l);
  }
  // sit under the site icons so sites stay clickable
  const first = svg.querySelector('g.site');
  const ref = first ? (first.parentNode.localName === 'a' ? first.parentNode : first) : null;
  if (ref) ref.parentNode.insertBefore(g, ref); else svg.append(g);
}
function ring(x, y, r) { const c = document.createElementNS(NS, 'circle'); c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r); c.setAttribute('class', 'ring'); svg.append(c); }
function nav(prev, next) {
  $('prev').hidden = !prev; $('next').hidden = !next;
  if (prev) $('prev').href = prev; if (next) $('next').href = next;
}
async function route() {
  const r = parse();
  const path = r.view === 'expl' ? EX[r.key].map : D.world.map;
  let title, small, up = null;
  if (r.view === 'world') { title = D.title; small = D.scales.world_hex_mi + '-mile hexes'; nav(null, '#atlas-1'); }
  else if (r.view === 'atlas') { const a = D.atlas[r.page - 1]; title = 'Atlas page ' + a.page; small = 'hex ' + a.id; up = ['#world', '← ' + D.short]; nav(a.page > 1 && '#atlas-' + (a.page - 1), a.page < D.atlas.length && '#atlas-' + (a.page + 1)); }
  else { const p = EX[r.key]; title = p.title; small = 'exploration map ' + p.page; up = ['#world', '← ' + D.short]; const i = p.page - 1;
         nav(i > 0 && '#' + D.exploration[i - 1].key, i < D.exploration.length - 1 && '#' + D.exploration[i + 1].key); }
  $('title').replaceChildren(title, Object.assign(document.createElement('small'), { textContent: small }));
  $('up').hidden = !up; if (up) { $('up').href = up[0]; $('up').textContent = up[1]; }
  document.title = r.view === 'world' ? D.title : title + ' · ' + D.short;
  if (cur !== path) {
    stage.innerHTML = '<p class="msg">Loading the map…</p>';
    try { stage.innerHTML = await load(path); } catch (e) { stage.innerHTML = '<p class="msg">This map could not be loaded. Reload the page to try again.</p>'; return; }
    svg = stage.querySelector('svg'); natW = svg.viewBox.baseVal.width; natH = svg.viewBox.baseVal.height;
    svg.removeAttribute('width'); svg.removeAttribute('height'); cur = path; z = 1;
    if (path === D.world.map) pageHexes();
    setZoom(fit(), 0, 0); stage.scrollLeft = 0; stage.scrollTop = 0;
  }
  svg.querySelectorAll('.ring').forEach(e => e.remove());
  svg.querySelectorAll('.pagehex').forEach(e => e.classList.toggle('on', r.view === 'atlas' && +e.dataset.page === r.page));
  if (r.view === 'atlas') { const a = D.atlas[r.page - 1]; setZoom(Math.max(fit(), Math.min(1, stage.clientHeight / (a.radius_px * 1.9))), a.center_px[0] / natW, a.center_px[1] / natH); }
  if (r.view === 'expl') {
    const p = EX[r.key]; const s = r.focus && p.sites.find(x => x.slug === r.focus);
    if (s) { ring(s.px[0], s.px[1], 34); setZoom(Math.max(fit(), .8), s.px[0] / natW, s.px[1] / natH); }
  }
  mark('#' + (r.view === 'world' ? 'world' : r.view === 'atlas' ? 'atlas-' + r.page : r.key + (r.focus ? '--' + r.focus : '')));
}
function item(href, name, tag) {
  const a = document.createElement('a'); a.href = href; a.dataset.h = href;
  a.append(Object.assign(document.createElement('span'), { textContent: name }), Object.assign(document.createElement('span'), { textContent: tag }));
  const li = document.createElement('li'); li.append(a); li.dataset.q = (name + ' ' + tag).toLowerCase(); return li;
}
function sec(title, lis) { const d = document.createElement('section'); const u = document.createElement('ul'); u.append(...lis); d.append(Object.assign(document.createElement('h2'), { textContent: title }), u); return d; }
function build() {
  lists.append(sec('Atlas', [item('#world', 'The whole season', D.scales.world_hex_mi + ' mi'), ...D.atlas.map(a => item('#atlas-' + a.page, 'Page ' + a.page + ' · hex ' + a.id, a.sites.length + ' sites'))]));
  for (const b of D.books) {
    const ps = D.exploration.filter(p => p.book === b.id);
    if (ps.length) lists.append(sec(b.id + ' · ' + b.title, ps.map(p => item('#' + p.key, p.title, 'p. ' + p.page))));
  }
  const pr = D.print && D.print.atlas ? `Print: <a href="${D.print.atlas}">atlas PDF</a> · <a href="${D.print.exploration}">exploration PDF</a>. ` : '';
  $('foot').innerHTML = pr + `Links for the companion app: <code>#world</code>, <code>#atlas-7</code>, <code>#&lt;map&gt;--&lt;site&gt;</code>; data in <code>module.json</code>. ${D.version} · ${D.license}.`;
}
function mark(h) { lists.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.h === h || h.startsWith(a.dataset.h + '--'))); }
$('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  const hit = new Set(D.sites.filter(s => s.name.toLowerCase().includes(q)).map(s => s.exploration));
  lists.querySelectorAll('li').forEach(li => { const h = li.firstChild.dataset.h.slice(1); li.hidden = q && !li.dataset.q.includes(q) && !hit.has(h); });
  lists.querySelectorAll('section').forEach(s => s.hidden = ![...s.querySelectorAll('li')].some(li => !li.hidden));
});
$('zi').onclick = () => setZoom(z * 1.25); $('zo').onclick = () => setZoom(z / 1.25); $('zf').onclick = () => setZoom(fit(), .5, 0);
addEventListener('hashchange', route);
build(); route();
</script>
