<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E9 Atlas</title>
<style>
:root{--bg:#f4efe1;--ink:#2b2418;--dim:#6b604c;--line:#8a7f66;--red:#7a2e2e}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
body{display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;border-bottom:1px solid #d8cfb8}
h1{font-size:16px;margin:0;font-weight:normal;flex:1 1 320px}
h1 a{color:var(--red);text-decoration:none;white-space:nowrap}h1 a:hover{text-decoration:underline}h1 b{white-space:nowrap}
.ctl{display:flex;gap:6px;align-items:center;font-size:14px}
#gridc{width:26px;height:22px;padding:0 1px;border:1px solid #b8ab8c;border-radius:4px;background:none;cursor:pointer}#grida{width:60px}body:has(#edges:not(:checked)) #gridc,body:has(#edges:not(:checked)) #grida{display:none}
button,select{font:inherit;font-size:14px;background:#fffaf0;border:1px solid #b8ab8c;border-radius:4px;padding:2px 8px;color:var(--ink)}
#main{flex:1;display:flex;min-height:0;position:relative}#map{flex:1;position:relative;min-height:0}
#key{width:250px;overflow:auto;border-left:1px solid #d8cfb8;padding:8px 12px;font-size:13px;background:var(--bg)}
#key h2{font-size:13px;margin:10px 0 4px;color:var(--dim);font-weight:normal;text-transform:uppercase;letter-spacing:.05em}
#key .row{display:flex;align-items:center;gap:8px;padding:2px 0}#key .pl{cursor:pointer;border-radius:4px}#key .pl:hover{background:#ebe3cf}
#key .sw{width:30px;height:26px;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
#key .sw img{max-width:26px;max-height:22px}#key small{color:var(--dim)}
#key .tg{font:inherit;font-size:11px;width:16px;padding:0;border:0;background:none;color:var(--dim);cursor:pointer;flex:none}#key .tg0{width:16px;flex:none}
#key .emb{font:inherit;font-size:12px;padding:0 6px;margin-top:2px;border-radius:10px;cursor:pointer}#key .emb:hover{background:#ebe3cf}
#mod{color:var(--red)}
#modules,#credits{border:1px solid #b8ab8c;border-radius:8px;background:var(--bg);color:var(--ink);padding:12px 16px;max-width:min(440px,92vw)}#modules::backdrop{background:#0004}
#modules h2,#credits h2{font-size:16px;margin:0 0 8px;font-weight:normal}#modules ul,#credits ul{list-style:none;margin:0 0 10px;padding:0}
#credits li{margin:4px 0;font-size:13px}#credits a{color:var(--red)}
#modules li button{width:100%;text-align:left;margin:2px 0;padding:6px 10px}#modules li button[disabled]{opacity:.55;cursor:default}#modules li button.on{border-color:var(--red)}#modules small{color:var(--dim)}
body.nokey #key{display:none}@media(max-width:700px){#key{position:absolute;right:0;top:0;bottom:0;box-shadow:-2px 0 8px #0003}}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
footer{display:flex;justify-content:space-between;gap:12px;padding:4px 16px;font-size:12px;color:var(--dim);border-top:1px solid #d8cfb8}
#hover{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#route,#party{position:absolute;left:10px;top:10px;z-index:2;max-width:calc(100% - 20px);background:#fffaf0ee;border:1px solid #b8ab8c;border-radius:6px;padding:6px 10px;font-size:13px;box-shadow:0 2px 8px #0002}
#route[hidden],#party[hidden]{display:none}#route b,#party b{color:var(--red)}#route small,#party small{color:var(--dim)}#route button,#party button{font-size:12px;padding:0 8px;margin:4px 6px 0 0}
#party{top:auto;bottom:10px}#party a{color:var(--red)}
#routebtn.on,#partybtn.on{border-color:var(--red);color:var(--red)}
footer a{color:var(--red)}
</style></head><body>
<header><h1 id="crumbs"></h1>
<div class="ctl"><select id="lang" aria-label="Language" hidden></select>
<label><input type="checkbox" id="edges" checked> Hex Edges</label><input type="color" id="gridc" value="#ffffff" title="Colour of the larger hex outlines"><input type="range" id="grida" min="10" max="100" value="80" title="Opacity of the larger hex outlines">
<button id="out" title="Zoom out">−</button><button id="in" title="Zoom in">+</button><button id="fit">Fit</button><button id="routebtn" title="Plot a route and estimate the travel time">Route</button><button id="partybtn" title="Show, place or move the party">Party</button><button id="keybtn">Key</button><button id="modbtn" title="Load a different module">Modules</button></div></header>
<div id="main"><div id="map"><canvas id="cv"></canvas><div id="route" hidden aria-live="polite"></div><div id="party" hidden aria-live="polite"></div></div><aside id="key"></aside></div>
<footer><span id="hover">Click a hex to zoom in.</span><span><span id="support"></span>E9 Atlas {{ATLAS}}<span id="modver"></span> · <a href="#" id="creditbtn">Credits</a></span></footer>
<dialog id="modules"><h2>Load a module</h2><ul id="modlist"></ul><button id="modclose">Close</button></dialog>
<dialog id="credits"><h2>Credits</h2><ul id="creditlist"></ul><button id="creditclose">Close</button></dialog>

<script>
"use strict";
const CW = 50 * Math.sqrt(3), SQ3 = Math.sqrt(3), LAB = '0123456789ABCDEFGHJKLMNPRSTUVWXYZ';

}

  const s = 100 / SQ3, px = x / N, py = y / N, q = (2 / 3 * px) / s, r = (-px / 3 + SQ3 / 3 * py) / s;

// ---- data ----
const IMG = {};

// the map arrives in pieces (Heph 2026-11-06, Atlas 0.4.9; atlas_cache.py, ATLAS_FORMAT.md "Tile cache"): one small overview of every League,
// then tiles of Fields (per March), Furlongs and 100-ft hexes (per League), fetched around the view as it moves and dropped when far away
let OV = null, CA = null, KEY = {}, FRAME = 0;

}
function keepNear() {  // fetch the ring round the view's centre at this level, and forget tiles of that kind outside it and not drawn this frame
  const kind = AROUND[V.lvl]; if (!kind) return;
  const r = RING[kind], N = kind === 'f' ? 1200 : 150, [ci, cj] = hexAt(cam.x, cam.y, N), want = new Set();
  for (let i = ci - r; i <= ci + r; i++) for (let j = cj - r - 1; j <= cj + r + 1; j++) {
    if (hexDist(i, j, ci, cj) > r) continue; const name = kind === 'f' ? (MI.get(i + ',' + j) || {}).id : i + '_' + j;

}

  if (N === 150) { const u = i - OV.i0, v = j - OV.j0; return u >= 0 && v >= 0 && u < OV.w && v < OV.h ? OV.a[v * OV.w + u] : 0; }

    const a = piece('f', m.id), s = CA.fields; return a ? a[(j - m.F[1] + s.dv) * s.w + i - m.F[0] + s.du] : 0;

function addr(C, R) {

const fieldAddr = (C, R) => '#field:' + addr(C, R).slice(7);  // a Field, named by any 100-ft hex in it

const plainVer = v => String(v || '').replace(/^v/, '');
function pick(id) { const u = new URL(location.href); u.searchParams.set('module', id); u.hash = ''; location.href = u.href; }
function modList() {
  document.getElementById('modlist').innerHTML = MODS.map(m => `<li><button data-id="${esc(m.id)}"${m.ok ? '' : ' disabled'}${m === MOD ? ' class="on"' : ''}>${esc(m.title)}<br><small>${esc(m.path)}${m.version ? ' · v' + esc(plainVer(m.version).split(' ')[0]) : ''}${m === MOD ? ' · loaded' : m.ok ? '' : ' · no atlas map'}</small></button></li>`).join('');
}
// Credits (Atlas 0.5.0): the Atlas's own tile art, then the module's data sources from its module.json "credits" (MODULE_FORMAT.md)
const ATLAS_CREDITS = [{ what: 'Hex tile art', by: 'C. Martins (Hex Tiles: Fantasy; edited icons by Heph)', license: 'CC BY-SA 4.0', url: 'https://cmartins.itch.io/hex-tiles-fantasy' }];
const LIC = { 'CC BY 4.0': 'https://creativecommons.org/licenses/by/4.0/', 'CC BY-SA 4.0': 'https://creativecommons.org/licenses/by-sa/4.0/', 'ODbL': 'https://opendatacommons.org/licenses/odbl/' };
function creditList() {
  const link = (t, u) => /^https:\/\//.test(u || '') ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t || '')}</a>` : esc(t || '');
  const row = c => `<li>${link(c.what, c.url)}: ${esc(c.by || '')}${c.license ? ' (' + link(c.license, LIC[c.license]) + ')' : ''}</li>`;
  const mod = (MOD && MOD.credits) || [];
  document.getElementById('creditlist').innerHTML = ATLAS_CREDITS.map(row).join('') + (mod.length ? `<li><small>${esc(MOD.title)}</small></li>` + mod.map(row).join('') : '');
}
document.getElementById('creditbtn').onclick = e => { e.preventDefault(); creditList(); document.getElementById('credits').showModal(); };
document.getElementById('creditclose').onclick = () => document.getElementById('credits').close();
document.getElementById('modbtn').onclick = () => { modList(); document.getElementById('modules').showModal(); };
document.getElementById('modclose').onclick = () => document.getElementById('modules').close();
document.getElementById('modlist').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b && !b.disabled) { if (MOD && b.dataset.id === MOD.id) document.getElementById('modules').close(); else pick(b.dataset.id); } });
async function loadModules() {
  const repo = await (await fetch(new URL('mm.json', SITE))).json();
  MODS = await Promise.all((repo.modules || []).map(async m => {
    const base = new URL(m.path.replace(/\/?$/, '/'), SITE).href, r = { id: m.id, path: m.path, title: m.id, version: '', base, ok: false };
    try { const j = await (await fetch(base + 'module.json')).json(); Object.assign(r, { title: j.title || m.id, version: j.version || '', credits: j.credits || [], languages: j.languages, ok: !!j.atlas_map }); } catch (e) {}
    return r; }));
  const want = new URLSearchParams(location.search).get('module') || store.get('e9-atlas-module');
  MOD = MODS.find(m => m.id === want && m.ok) || MODS.find(m => m.ok);
}

(async () => {
  try { await loadModules(); } catch (e) {}
  if (!MOD) { document.getElementById('crumbs').textContent = 'No module with an atlas map was found.'; if (MODS.length) { modList(); document.getElementById('modules').showModal(); } return; }
  A = MOD.base + 'atlas/'; store.set('e9-atlas-module', MOD.id);
  document.title = MOD.title + ' · E9 Atlas'; document.getElementById('modver').textContent = ' · ' + MOD.title + (MOD.version ? ' v' + plainVer(MOD.version).split(' ')[0] : '');
  D = await (await fetch(A + 'map.json', { cache: 'no-cache' })).json(); TYPES = D.terrain.types; LBL = D.labels; D.names = D.names || {}; langs();  // always the current map.json: an old one has no tile cache
  if (!D.cache) { document.getElementById('crumbs').textContent = 'This module\'s map was built for an older Atlas. Rebuild the site, then reload this page.'; return; }
  TYPES.forEach((t, k) => { T_BG[k + 1] = t.tile; if (t.icon) T_ICON[k + 1] = t.icon; });
  await loadCache();
  let SC = {};
  try { const j = await (await fetch(A + 'creatures.json')).json(); CR = j.creatures || []; SC = j.scenes || {}; } catch (e) { CR = []; }  // a module without creatures has no file
  if (window.E9Map) Object.assign(E9Map, { base: MOD.base, module: MOD.id, creatures: CR, scenes: SC,
    places: D.pois.filter(p => p.encounter).map(p => ({ get name() { return name(p.name); }, pointers: p.encounter, go: () => { location.hash = addr(...p.hex); } })) });  // ways out lead back to the place's 100-ft hex  // encounter maps sit in the module folder
  loadParty(); smoothRivers(); go();
})();
</script></body></html>
