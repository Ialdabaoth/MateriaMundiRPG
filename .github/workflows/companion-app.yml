name: Companion app

on:
  push:
    branches: [main]
    paths: ['companion-app/**', '.github/workflows/companion-app.yml']
  pull_request:
    paths: ['companion-app/**', '.github/workflows/companion-app.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: companion-app-pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: companion-app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: companion-app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
