name: Site (modules)

on:
  push:
    branches: [main]
    paths: ['modules/**', 'mm.json', 'links.json', '.github/**']
  pull_request:
    paths: ['modules/**', 'mm.json', 'links.json', '.github/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds and main deploys queue separately, so a PR build can never cancel a deploy (they did on 2026-11-05);
# a newer push still cancels an older build of the same branch or PR
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The E9 apps and the module build tools live in the apps repo (links.json "apps.repo", Heph 2026-11-08);
      # copy its modules/tools/ in, so build.py reads this repo's modules/assets, geo and requirements as before
      - id: apps
        run: echo "repo=$(jq -r .apps.repo links.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.apps.outputs.repo }}
          path: .apps
      - run: cp -R .apps/modules/tools modules/tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # modules/.cache holds the elevation tiles and each module's built maps (build.py "build cache": keyed on every
      # input the map steps read, so a module whose maps did not change is copied, not redrawn). A new entry each run,
      # restored from the newest one, so the cache always follows the latest build
      - uses: actions/cache@v4
        with:
          path: modules/.cache
          key: module-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            module-build-
            module-terrain-
      # no print PDFs for now (Heph 2026-11-07: until the print process is discussed); build.py --pdf makes them, with Playwright
      - name: Modules (maps, manifests)
        run: |
          pip install -r modules/requirements.txt
          mkdir -p site
          for m in modules/*/module.json; do
            id=$(basename "$(dirname "$m")")
            # rules modules ("kind": "rules", e.g. modules/mm-core) have no maps; the Companion bundles them
            python3 -I -c 'import json,sys; sys.exit(json.load(open(sys.argv[1])).get("kind") != "rules")' "$m" && continue
            python3 -I modules/tools/build.py "modules/$id" "site/modules/$id"
          done
          cp mm.json site/mm.json
      - name: Forward the old app addresses to the apps site
        run: python3 -I .github/scripts/forward.py site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
