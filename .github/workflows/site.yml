name: Site (companion app + modules)

on:
  push:
    branches: [main]
    paths: ['companion-app/**', 'modules/**', 'mm.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['companion-app/**', 'modules/**', 'mm.json', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds and main deploys queue separately, so a PR build can never cancel a deploy (they did on 2026-11-05);
# a newer push still cancels an older build of the same branch or PR
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion-app/package-lock.json
      - name: Companion app
        working-directory: companion-app
        run: |
          npm ci
          npm run check
          npm test
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # modules/.cache holds the elevation tiles and each module's built maps (build.py "build cache": keyed on every
      # input the map steps read, so a module whose maps did not change is copied, not redrawn). A new entry each run,
      # restored from the newest one, so the cache always follows the latest build
      - uses: actions/cache@v4
        with:
          path: modules/.cache
          key: module-build-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            module-build-
            module-terrain-
      # no print PDFs for now (Heph 2026-11-07: until the print process is discussed); build.py --pdf makes them, with Playwright
      - name: Modules (maps, manifests)
        run: |
          pip install -r modules/requirements.txt
          for m in modules/*/module.json; do
            id=$(basename "$(dirname "$m")")
            python3 -I modules/tools/build.py "modules/$id" "companion-app/dist/modules/$id"
          done
          cp mm.json companion-app/dist/mm.json
          python3 -I modules/tools/atlas_app.py companion-app/dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: companion-app/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
